<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #f9f9ff;
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom Ambient Shadow Level 1 */
        .ambient-shadow {
            box-shadow: 0 4px 12px rgba(17, 24, 39, 0.05);
        }
        /* Focus state for inputs */
        .input-focus:focus-within {
            border-color: #4648d4;
            box-shadow: 0 0 0 4px rgba(70, 72, 212, 0.1);
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="font-body-md text-on-surface">
<!-- TopAppBar -->
<header class="bg-surface sticky top-0 z-40">
<div class="flex justify-between items-center w-full px-margin-mobile py-4 max-w-7xl mx-auto">
<div class="flex items-center gap-3">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-container-low transition-colors" onclick="window.history.back()">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="text-title-md font-title-md font-bold text-primary">FollowUp CRM</h1>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface-variant p-2">notifications</span>
<div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed font-bold text-xs">
                    JD
                </div>
</div>
</div>
</header>
<main class="max-w-xl mx-auto px-margin-mobile pt-stack-lg pb-32">
<!-- Form Header -->
<div class="mb-stack-lg">
<h2 class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface">New Contact</h2>
<p class="text-body-md text-on-surface-variant mt-1">Add a new lead or customer to your CRM pipeline.</p>
</div>
<!-- Progress/Section Indicator (Bento style hint) -->
<div class="bg-white p-5 rounded-[24px] mb-stack-lg ambient-shadow border border-gray-border flex items-center gap-4">
<div class="w-12 h-12 bg-primary-container rounded-xl flex items-center justify-center text-white">
<span class="material-symbols-outlined">person_add</span>
</div>
<div>
<p class="text-label-md font-label-md text-primary uppercase">Quick Create</p>
<p class="text-body-lg font-medium">Contact Information</p>
</div>
</div>
<!-- Form Card -->
<form class="space-y-stack-md" id="contactForm">
<!-- Contact Field Group -->
<div class="bg-white p-5 rounded-[24px] ambient-shadow border border-gray-border space-y-stack-md">
<!-- Name -->
<div class="space-y-1.5">
<label class="text-label-md font-label-md text-on-surface-variant ml-1" for="name">NAME</label>
<div class="relative group">
<input class="w-full h-12 px-4 bg-white border border-gray-border rounded-xl text-body-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" id="name" name="name" placeholder="Full Name" type="text"/>
</div>
</div>
<!-- Email -->
<div class="space-y-1.5">
<label class="text-label-md font-label-md text-on-surface-variant ml-1" for="email">EMAIL ADDRESS</label>
<input class="w-full h-12 px-4 bg-white border border-gray-border rounded-xl text-body-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" id="email" name="email" placeholder="email@company.com" type="email"/>
</div>
<!-- Phone -->
<div class="space-y-1.5">
<label class="text-label-md font-label-md text-on-surface-variant ml-1" for="phone">PHONE NUMBER</label>
<input class="w-full h-12 px-4 bg-white border border-gray-border rounded-xl text-body-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" id="phone" name="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
<!-- Company -->
<div class="space-y-1.5">
<label class="text-label-md font-label-md text-on-surface-variant ml-1" for="company">COMPANY</label>
<input class="w-full h-12 px-4 bg-white border border-gray-border rounded-xl text-body-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" id="company" name="company" placeholder="Organization Name" type="text"/>
</div>
</div>
<!-- Status Selector -->
<div class="bg-white p-5 rounded-[24px] ambient-shadow border border-gray-border">
<label class="text-label-md font-label-md text-on-surface-variant ml-1 mb-3 block">CONTACT STATUS</label>
<div class="grid grid-cols-2 gap-3" id="statusContainer">
<button class="status-btn flex items-center justify-between px-4 py-3 border border-gray-border rounded-xl hover:bg-surface-container-low transition-all active:scale-95" data-status="lead" type="button">
<span class="text-body-md font-medium">Lead</span>
<div class="w-3 h-3 rounded-full bg-blue-500"></div>
</button>
<button class="status-btn flex items-center justify-between px-4 py-3 border border-gray-border rounded-xl hover:bg-surface-container-low transition-all active:scale-95" data-status="qualified" type="button">
<span class="text-body-md font-medium">Qualified</span>
<div class="w-3 h-3 rounded-full bg-success"></div>
</button>
<button class="status-btn flex items-center justify-between px-4 py-3 border border-gray-border rounded-xl hover:bg-surface-container-low transition-all active:scale-95" data-status="negotiation" type="button">
<span class="text-body-md font-medium">Negotiation</span>
<div class="w-3 h-3 rounded-full bg-tertiary-container"></div>
</button>
<button class="status-btn flex items-center justify-between px-4 py-3 border border-gray-border rounded-xl hover:bg-surface-container-low transition-all active:scale-95" data-status="closed" type="button">
<span class="text-body-md font-medium">Closed</span>
<div class="w-3 h-3 rounded-full bg-on-surface-variant"></div>
</button>
</div>
</div>
<!-- Additional Detail (Visual Flourish) -->
<div class="bg-primary-fixed/30 p-5 rounded-[24px] border border-primary-fixed flex items-start gap-4">
<span class="material-symbols-outlined text-primary-container">info</span>
<p class="text-label-md text-on-primary-fixed-variant">New contacts are automatically added to your daily follow-up list to ensure high engagement within the first 24 hours.</p>
</div>
</form>
</main>
<!-- Bottom Action Bar -->
<footer class="fixed bottom-0 left-0 w-full bg-white/80 backdrop-blur-md z-50 p-margin-mobile border-t border-gray-border">
<div class="max-w-xl mx-auto flex gap-4">
<button class="flex-1 h-12 bg-surface-container-low text-on-surface-variant font-semibold rounded-xl hover:bg-surface-container-high transition-all" type="button">
                Cancel
            </button>
<button class="flex-[2] h-12 bg-primary text-white font-semibold rounded-xl ambient-shadow hover:bg-primary-container active:scale-95 transition-all flex items-center justify-center gap-2" id="submitBtn" type="button">
                Save Contact
                <span class="material-symbols-outlined text-[18px]">check_circle</span>
</button>
</div>
</footer>
<!-- BottomNavBar (Hidden on this transactional task screen per rules) -->
<!-- The prompt is transactional, so we exclude the global nav to focus on the form. -->
<script>
        // Simple micro-interactions for the status selector
        const statusBtns = document.querySelectorAll('.status-btn');
        let selectedStatus = null;

        statusBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Clear previous selection
                statusBtns.forEach(b => {
                    b.classList.remove('border-primary', 'bg-primary-fixed/20');
                    b.classList.add('border-gray-border');
                });
                
                // Set new selection
                btn.classList.add('border-primary', 'bg-primary-fixed/20');
                btn.classList.remove('border-gray-border');
                selectedStatus = btn.getAttribute('data-status');
            });
        });

        // Form Submission visual feedback
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.addEventListener('click', () => {
            const btnText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Saving...
            `;

            setTimeout(() => {
                submitBtn.innerHTML = `
                    Saved Successfully
                    <span class="material-symbols-outlined text-[18px]">verified</span>
                `;
                submitBtn.classList.remove('bg-primary');
                submitBtn.classList.add('bg-success');
                
                setTimeout(() => {
                    submitBtn.innerHTML = btnText;
                    submitBtn.classList.remove('bg-success');
                    submitBtn.classList.add('bg-primary');
                    submitBtn.disabled = false;
                }, 2000);
            }, 1200);
        });

        // Auto-select first status
        statusBtns[0].click();
    </script>
</body></html>
